name: Validate SUS Jekyll site
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub Pages Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated site and published article
        run: python3 scripts/validate_site.py _site
