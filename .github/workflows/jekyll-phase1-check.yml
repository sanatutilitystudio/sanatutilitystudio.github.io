name: Validate SUS Jekyll site
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub Pages Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated site and published article
        run: python3 scripts/validate_site.py _site
      - name: Package local editorial preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sus-retro-article-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7
